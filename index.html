<!DOCTYPE html>
<html>
<head>
    <title>Image Gallery - Rozina Mehmood</title>
    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #f4f4f4;
        }

        header {
            background: #222;
            color: white;
            text-align: center;
            padding: 30px;
        }

            header h1 {
                margin: 0;
            }

            header p {
                color: #ffb703;
            }

        .filters {
            text-align: center;
            padding: 20px;
        }

            .filters button {
                background: #222;
                color: white;
                border: none;
                padding: 10px 20px;
                margin: 5px;
                border-radius: 20px;
                cursor: pointer;
                font-size: 15px;
            }

                .filters button:hover, .filters button.active {
                    background: #ffb703;
                    color: #222;
                }

        .gallery {
            display: grid;
            grid-template-columns: repeat(3,1fr);
            gap: 15px;
            max-width: 900px;
            margin: auto;
            padding: 0 20px 30px;
        }

            .gallery img {
                width: 100%;
                height: 220px;
                object-fit: cover;
                border-radius: 12px;
                cursor: pointer;
                transition: 0.3s;
            }

                .gallery img:hover {
                    transform: scale(1.05);
                }

        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

            .lightbox img {
                max-width: 80%;
                max-height: 75%;
                border-radius: 12px;
            }

            .lightbox p {
                color: white;
            }

            .lightbox button {
                background: #ffb703;
                border: none;
                padding: 10px 20px;
                margin: 10px;
                border-radius: 8px;
                cursor: pointer;
                font-size: 16px;
            }

        @media(max-width:600px) {
            .gallery {
                grid-template-columns: repeat(2,1fr);
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>My Image Gallery</h1>
        <p>My Personal Project - Frontend Development</p>
    </header>
    <div class="filters">
        <button class="active" onclick="filterImages('all',this)">All</button>
        <button onclick="filterImages('nature',this)">Nature</button>
        <button onclick="filterImages('city',this)">City</button>
        <button onclick="filterImages('animal',this)">Animals</button>
    </div>
    <div class="gallery" id="gallery">
        <img src="https://images.unsplash.com/photo-1465146344425-f00d5f5c8f07?w=500" data-cat="nature" onclick="openLightbox(this.src)" alt="Flowers">
        <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=500" data-cat="nature" onclick="openLightbox(this.src)" alt="Mountain Lake">
        <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=500" data-cat="nature" onclick="openLightbox(this.src)" alt="Forest">
        <img src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=500" data-cat="city" onclick="openLightbox(this.src)" alt="Murree Pakistan">
        <img src="https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?w=500" data-cat="city" onclick="openLightbox(this.src)" alt="City 1">
        <img src="https://images.unsplash.com/photo-1449824913935-59a10b8d2000?w=500" data-cat="city" onclick="openLightbox(this.src)" alt="City 2">
        <img src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=500" data-cat="animal" onclick="openLightbox(this.src)" alt="Cute Cat">
        <img src="https://images.unsplash.com/photo-1589656966895-2f33e7653819?w=500" data-cat="animal" onclick="openLightbox(this.src)" alt="Bear">
        <img src="https://images.unsplash.com/photo-1484406566174-9da000fda645?w=500" data-cat="animal" onclick="openLightbox(this.src)" alt="Deer">
    </div>
    <div class="lightbox" id="lightbox">
        <img id="lightboxImg" src="">
        <p>Click Close to go back</p>
        <button onclick="closeLightbox()">Close ✖</button>
    </div>
    <script>
function filterImages(cat, btn){
                  let imgs = document.querySelectorAll('.gallery img');
                  document.querySelectorAll('.filters button').forEach(b=>b.classList.remove('active'));
                  btn.classList.add('active');
                  imgs.forEach(img=>{
                    if(cat==='all' || img.dataset.cat===cat){ img.style.display='block'; }
                    else{ img.style.display='none'; }
                  });
}
function openLightbox(src){
                  document.getElementById('lightboxImg').src = src;
                  document.getElementById('lightbox').style.display='flex';
}
function closeLightbox(){
                  document.getElementById('lightbox').style.display='none';
}
    </script>
</body>
</html>
